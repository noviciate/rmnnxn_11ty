---
layout: default
---
<style>
  .post-content img:not([data-attr="head-img"]) {
    max-height: 80vh;
    width: 100%;
    vertical-align: middle;
    object-fit: contain;
  }
  .post-content img + em {
    display: block;
    text-align: center;
    font-size: 0.85rem;
    color: #666;
    margin-top: 0.25rem;
    margin-bottom: 1.5rem;
  }
  .post-header {
    margin-bottom: 2rem;
  }
  .post-title {
    font-family: 'Space Grotesk', sans-serif;
  }
  .post-meta {
    font-size: 0.85rem;
    color: #666;
  }
  .post-content {
    max-width: 680px;
    line-height: 1.7;
  }
  .back-link {
    display: inline-block;
    margin-bottom: 2rem;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 0.85rem;
    color: #333;
    text-decoration: none;
    letter-spacing: 0.05em;
  }
  .back-link:hover {
    color: #000;
  }
</style>

<article class="post">
  <a class="back-link" href="/writing/">← Writing</a>

  <header class="post-header">
    <h1 class="post-title">{{ title }}</h1>
    <p class="post-meta">{{ date | date: "%b %d, %Y" }}</p>
  </header>

  <div class="post-content">
    {{ content }}
  </div>
</article>
