---
layout: default
---

<style>

/* ── Portrait ── */
.home-portrait {
  text-align: center;
  padding: 0rem 0 2rem;
}

.home-portrait img {
  max-width: 340px;
  width: 100%;
  display: inline-block;
  box-shadow: 2px 2px 10px rgba(0,0,0,0.18);
  outline: 2px solid rgba(255, 255, 255, 0.3);
  outline-offset: -10px;
}

/* ── Sections ── */
.home-sections {
  max-width: 720px;
  margin: 0 auto;
  padding: 0 1.5rem 4rem;
}

.home-section {
  margin-bottom: 4rem;
}

/* ── Section links ── */
.home-section-link,
.writing-section-link,
.photo-collage-link {
  display: block;
  text-decoration: none;
  position: relative;
  overflow: hidden;
}

/* ── Shared overlay base ── */
.section-overlay {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  pointer-events: none;
  z-index: 10;
}

.section-overlay span {
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 500;
  text-shadow: 1px 1px 8px rgba(0,0,0,0.7);
  display: block;
}

/* ── Paintings ── */
.home-section-link img {
  width: 100%;
  height: 300px;
  object-fit: cover;
  display: block;
  transition: opacity 0.3s ease;
  border-radius: 2px;
}

.home-section-link:hover img {
  opacity: 0.85;
}

.home-section-link .section-overlay {
  padding: 3rem 1.5rem 0.8rem;
  background: linear-gradient(to top, rgba(252,220,181,0.2) 0%, transparent 100%);
  display: flex;
  justify-content: center;
  align-items: flex-end;
}

.home-section-link .section-overlay span {
  font-size: clamp(1.6rem, 5.5vw, 3rem);
  letter-spacing: 0.8em;
  color: rgba(252,220,181,0.8);
  text-transform: none;
  margin-right: -0.8em; /* cancel the trailing letter-spacing */
}

/* ── Photos ── */
.photo-collage-link {
  overflow: visible;
}

.photo-collage {
  position: relative;
  height: 280px;
  margin: 0 auto;
}

.photo-collage img {
  position: absolute;
  width: 55%;
  height: 210px;
  object-fit: cover;
  border: 6px solid white;
  box-shadow: 2px 2px 10px rgba(0,0,0,0.18);
  transition: opacity 0.3s ease;
}

.photo-collage-link:hover .photo-collage img {
  opacity: 0.85;
}

.photo-collage img:nth-child(1) {
  left: 0;
  top: 25px;
  transform: rotate(-3deg);
  z-index: 1;
}

.photo-collage img:nth-child(2) {
  left: 23%;
  top: 0;
  transform: rotate(1.5deg);
  z-index: 2;
}

.photo-collage img:nth-child(3) {
  right: 0;
  top: 35px;
  transform: rotate(4deg);
  z-index: 3;
}

.photo-collage-link .section-overlay {
  height: 280px;
  z-index: 4;
  display: flex;
  align-items: flex-end;
  justify-content: flex-end;
  padding-bottom: 1.5rem;
  padding-right: 1.5rem;
  background: none;
}

.photo-collage-link .section-overlay span {
  font-size: clamp(1.4rem, 3.5vw, 2.4rem);
  letter-spacing: 0.12em;
  color: rgba(255,255,255,0.92);
}

/* ── Writing ── */
.writing-section-link img {
  width: 100%;
  height: 260px;
  object-fit: cover;
  display: block;
  transition: opacity 0.3s ease;
}

.writing-section-link:hover img {
  opacity: 0.85;
}

.writing-section-link .section-overlay {
  padding: 3rem 1.5rem 1.2rem;
  background: linear-gradient(to top, rgba(0,0,0,0.65) 0%, transparent 100%);
  text-align: center;
}

.writing-section-link .section-overlay span {
  font-size: clamp(1.8rem, 5vw, 4rem);
  letter-spacing: 0.15em;
  color: rgba(255,255,255,0.92);
}

/* ── Mobile ── */
@media screen and (max-width: 712px) {
  .home-portrait img {
    max-width: 260px;
  }

  .photo-collage {
    height: 220px;
  }

  .photo-collage img {
    height: 160px;
    border-width: 4px;
  }

  .photo-collage-link .section-overlay {
    height: 220px;
  }

  .home-section-link img {
    height: 240px;
  }

  .writing-section-link img {
    height: 200px;
  }
}

</style>

<!-- Portrait -->
<div class="home-portrait">
  <img src="/images/previews/2020_0320_00103300-01.jpg" alt="Self portrait" />
</div>

<!-- Sections -->
<div class="home-sections">

  <!-- Paintings -->
  <div class="home-section" id="paintings">
    <a class="home-section-link" href="/paintings/">
      <img src="/images/paintings/bronzeface-final.jpg" alt="Bronze Face" />
      <div class="section-overlay">
        <span>Paintings</span>
      </div>
    </a>
  </div>

  <!-- Photos -->
  <div class="home-section" id="photos">
    <a class="photo-collage-link" href="/photos/">
      <div class="photo-collage">
        <img src="/images/photos/trails/wakefulpeace.jpg" alt="Wakeful Peace" />
        <img src="/images/photos/flowers/ok-flower.jpg" alt="OK" />
        <img src="/images/photos/water/memoriesoffallcanalrides.jpg" alt="Memories of Fall Canal Rides" />
      </div>
      <div class="section-overlay">
        <span>Photos</span>
      </div>
    </a>
  </div>

  <!-- Writing -->
  <div class="home-section" id="writing">
    <a class="writing-section-link" href="/writing/">
      <img src="/images/photos/water/glyphalprimitivism.jpg" alt="Glyphal Primitivism" />
      <div class="section-overlay">
        <span>Writing</span>
      </div>
    </a>
  </div>

</div>

<script>
// Scroll-then-navigate for header nav links on homepage only
document.querySelectorAll('.site-nav a.page-link').forEach(function(link) {
  var href = link.getAttribute('href');
  var sectionMap = {
    '/paintings/': 'paintings',
    '/photos/': 'photos',
    '/writing/': 'writing'
  };
  var sectionId = sectionMap[href];
  if (sectionId && document.getElementById(sectionId)) {
    link.addEventListener('click', function(e) {
      e.preventDefault();
      var target = document.getElementById(sectionId);
      target.scrollIntoView({ behavior: 'smooth' });
      setTimeout(function() {
        window.location.href = href;
      }, 400);
    });
  }
});
</script>
